name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] && MISSING="$MISSING NETLIFY_AUTH_TOKEN"
          [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]    && MISSING="$MISSING NETLIFY_SITE_ID"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing secrets:$MISSING"
            echo "Go to: GitHub Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AGORA_APP_ID: ${{ secrets.VITE_AGORA_APP_ID }}

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --message="Deploy from GitHub Actions - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
